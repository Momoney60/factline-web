<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#06060a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO & Social -->
    <title>ReadOnly — Facts. No noise.</title>
    <meta name="description" content="A real-time intelligence feed built for information, not engagement. No likes. No comments. No creators chasing clicks. Just verified facts with sources and confidence scores." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReadOnly — Facts. No noise." />
    <meta property="og:description" content="Real-time intelligence feed. No likes, no comments, no opinions. Verified facts with sources and confidence scores." />
    <meta property="og:url" content="https://readonly.news" />
    <meta property="og:site_name" content="ReadOnly" />
    <meta property="og:image" content="https://readonly.news/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReadOnly — Facts. No noise." />
    <meta name="twitter:description" content="Real-time intelligence feed. Verified facts with sources and confidence scores." />
    <meta name="twitter:image" content="https://readonly.news/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
